# FastApi-Todos를 쿠버네티스에 올리는 실습용 매니페스트.
# docker-compose.yml에서 하던 설정이 쿠버네티스의 어떤 항목으로 옮겨 가는지 주석으로 표시했다.
#
# 데이터는 파일(todo.json)이 아니라 PostgreSQL에 저장한다. 앱 복제본이 여러 개여도 모두 같은 DB를 보므로
# 데이터가 갈라지거나 동시 쓰기가 유실되지 않는다 (k8s/README.md 실험 2, 6의 문제를 해결한 구조).
#
# DB 비밀번호는 이 파일에 적지 않는다(공개 저장소). 적용 전에 아래 명령으로 Secret을 먼저 만든다:
#   kubectl create secret generic todo-db --from-literal=POSTGRES_PASSWORD='원하는비밀번호'
---
# Postgres는 파드가 지워져도 데이터가 남아야 하므로 StatefulSet + 볼륨 템플릿(PVC)으로 둔다.
# 파드가 다시 떠도 같은 이름(postgres-0)과 같은 디스크를 다시 붙여 준다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1   # DB 서버는 하나. 복제본을 늘리는 건 앱(Deployment) 쪽이다
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: todo
            - name: POSTGRES_DB
              value: todos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-db
                  key: POSTGRES_PASSWORD
            # 마운트한 디스크의 맨 위에는 lost+found가 있을 수 있어서, 데이터는 하위 폴더에 둔다 (initdb가 빈 폴더를 요구함)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # 연결을 받을 준비가 되면 Ready. 앱의 readinessProbe와 별개로, Service(postgres)가 Ready인 파드로만 트래픽을 보낸다.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U todo -d todos"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U todo -d todos"]
            initialDelaySeconds: 20
            periodSeconds: 10
          # 공식 이미지는 root로 시작해 데이터 폴더 소유권을 정리한 뒤 postgres 사용자로 낮춰 실행한다.
          # 그 과정에 권한이 필요해서 앱처럼 capabilities 전체 제거와 non-root 고정은 걸지 않았다.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# 앱이 postgres:5432로 접속하는 고정 주소. clusterIP: None(headless)이라 StatefulSet 파드 이름(postgres-0)을 그대로 가리킨다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-todo
spec:
  # 데이터가 DB에 있으므로 앱은 상태가 없다(stateless). 복제본을 자유롭게 늘릴 수 있고, 하나가 죽어도 다른 하나가 받는다.
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-todo
  template:
    metadata:
      labels:
        app: fastapi-todo
    spec:
      containers:
        - name: fastapi-app
          # 로컬에서 빌드한 이미지 (README의 준비 단계).
          # 같은 태그로 다시 빌드하면 노드에 캐시된 옛 이미지가 계속 쓰이므로, 코드를 바꿀 때마다 태그를 바꾼다.
          image: fastapi-todo:db
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED   # compose의 environment와 동일
              value: "1"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-db
                  key: POSTGRES_PASSWORD
            # 쿠버네티스는 앞에서 정의한 환경변수를 $(이름)으로 가져다 쓸 수 있다. 비밀번호가 yaml에 남지 않는다.
            - name: DATABASE_URL
              value: postgresql+psycopg://todo:$(POSTGRES_PASSWORD)@postgres:5432/todos
          # compose의 mem_limit: 128m / cpus: 0.5 (부하테스트로 한계점을 보려고 건 제약)를 그대로 옮김.
          # 메모리 한도를 넘으면 컨테이너가 OOMKilled 된다 (README 실험 3).
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # readiness: 통과해야 Service가 트래픽을 보낸다. /todos는 DB를 조회하므로 "DB까지 연결된 상태"를 확인한다.
          # liveness: 실패하면 컨테이너를 재시작한다. DB 장애로 앱이 연달아 재시작되지 않게 DB를 안 쓰는 /로 확인한다.
          readinessProbe:
            httpGet:
              path: /todos
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          # compose의 security_opt(no-new-privileges), cap_drop: ALL, Dockerfile의 non-root 유저(uid 10001)에 대응.
          # 더 이상 앱이 파일을 쓰지 않으므로 루트 파일시스템을 읽기 전용으로 잠글 수 있다.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
# 파드는 죽고 다시 뜰 때마다 IP가 바뀌므로, 고정된 접속 주소(fastapi-todo:8000)를 만들어 주는 Service.
# 복제본 2개로 요청을 나눠 보낸다. 클러스터 안에서만 쓰는 ClusterIP이고, 내 PC에서는 kubectl port-forward로 접속한다.
apiVersion: v1
kind: Service
metadata:
  name: fastapi-todo
spec:
  type: ClusterIP
  selector:
    app: fastapi-todo
  ports:
    - port: 8000
      targetPort: 8000
