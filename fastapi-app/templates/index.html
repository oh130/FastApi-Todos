<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List v5.0.0</title>
  <style>
    :root {
      --page-bg: #f2f3f7;
      --surface: #ffffff;
      --fg: #1c1e26;
      --muted: #6b7280;
      --border: #e7e8ee;
      --accent: #4f46e5;
      --accent-fg: #ffffff;
      --done: #9ca3af;
      --error-bg: #fdecec;
      --error-fg: #b00020;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
      --priority-high-bg: #fee2e2;
      --priority-high-fg: #b42318;
      --priority-medium-bg: #fef3c7;
      --priority-medium-fg: #92610a;
      --priority-low-bg: #dcfce7;
      --priority-low-fg: #15803d;
    }
    [data-theme="dark"] {
      --page-bg: #15161c;
      --surface: #1e2029;
      --fg: #eceef2;
      --muted: #9aa0ad;
      --border: #30323d;
      --accent: #818cf8;
      --accent-fg: #15161c;
      --done: #6b7280;
      --error-bg: #3a1e22;
      --error-fg: #ff8a8a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
      --priority-high-bg: #4a1f1f;
      --priority-high-fg: #ff9a9a;
      --priority-medium-bg: #4a3f1a;
      --priority-medium-fg: #ffd66b;
      --priority-low-bg: #1f3a28;
      --priority-low-fg: #86efac;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0;
      padding: 2.5rem 1rem;
      background: var(--page-bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      padding: 1.75rem 1.75rem 1.25rem;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin: 0 0 1.5rem;
      font-size: 1.35rem;
      font-weight: 700;
    }
    h1 small {
      font-size: .7rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--page-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .15rem .55rem;
      margin-left: .4rem;
    }

    #theme-toggle {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: 999px;
      font-size: .8rem;
      padding: .4rem .75rem;
    }
    #theme-toggle:hover { border-color: var(--accent); }

    form.add-form {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-bottom: 1.1rem;
    }
    input[type="text"], input[type="date"], select {
      font: inherit;
      padding: .6rem .75rem;
      border: 1px solid var(--border);
      border-radius: .6rem;
      background: var(--surface);
      color: var(--fg);
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    #title { flex: 1 1 14rem; }
    #description { flex: 1 1 10rem; }

    button { font: inherit; cursor: pointer; }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: .6rem;
      padding: .6rem 1.1rem;
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .6rem;
      padding: .75rem 0 1rem;
      margin-bottom: .5rem;
      border-bottom: 1px solid var(--border);
    }
    .filters label {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .82rem;
      color: var(--muted);
    }
    .btn-ghost {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: .6rem;
      padding: .4rem .7rem;
      font-size: .8rem;
    }
    .btn-ghost:hover { border-color: var(--error-fg); color: var(--error-fg); }

    #error {
      background: var(--error-bg);
      color: var(--error-fg);
      border-radius: .6rem;
      padding: .6rem .8rem;
      font-size: .85rem;
      margin: 0 0 .75rem;
    }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .7rem .4rem;
      border-radius: .6rem;
    }
    li:hover { background: var(--page-bg); }
    li + li { margin-top: .1rem; }

    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .todo-text { flex: 1; min-width: 0; font-size: .95rem; }
    .todo-text.done { text-decoration: line-through; color: var(--done); }

    .priority {
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      padding: .2rem .55rem;
      white-space: nowrap;
    }
    .priority-high { background: var(--priority-high-bg); color: var(--priority-high-fg); }
    .priority-medium { background: var(--priority-medium-bg); color: var(--priority-medium-fg); }
    .priority-low { background: var(--priority-low-bg); color: var(--priority-low-fg); }

    .due { color: var(--muted); font-size: .8rem; white-space: nowrap; }

    .row-actions { display: flex; gap: .3rem; }
    .row-actions button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: .5rem;
      padding: .3rem .6rem;
      font-size: .78rem;
    }
    .row-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .row-actions button.danger:hover { border-color: var(--error-fg); color: var(--error-fg); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      padding: 2rem 0;
    }

    @media (max-width: 480px) {
      .card { padding: 1.25rem; border-radius: .75rem; }
      .filters { flex-direction: column; align-items: stretch; }
      .btn-ghost { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      To-Do List<small>v5.0.0</small>
      <button id="theme-toggle" type="button" aria-label="다크모드 전환">🌙 다크모드</button>
    </h1>
    <form id="todo-form" class="add-form">
      <input type="text" id="title" placeholder="제목 (예: 20231234 홍길동)" required>
      <input type="text" id="description" placeholder="설명 (선택 사항)">
      <select id="priority" aria-label="우선순위">
        <option value="high">높음</option>
        <option value="medium" selected>보통</option>
        <option value="low">낮음</option>
      </select>
      <input type="date" id="due-date" aria-label="마감일">
      <button type="submit" class="btn-primary">추가</button>
    </form>
    <div class="filters">
      <label>상태 <select id="status-filter"><option value="all">전체</option><option value="active">진행 중</option><option value="completed">완료</option></select></label>
      <label>우선순위 <select id="priority-filter"><option value="all">전체</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></label>
      <button id="clear-completed" type="button" class="btn-ghost">완료 항목 일괄삭제</button>
    </div>
    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const listEl = $("todo-list");
    const errorEl = $("error");
    let allTodos = [];

    const root = document.documentElement;
    const themeToggle = $("theme-toggle");
    function applyTheme(theme) {
      if (theme === "dark") {
        root.setAttribute("data-theme", "dark");
        themeToggle.textContent = "☀️ 라이트모드";
      } else {
        root.removeAttribute("data-theme");
        themeToggle.textContent = "🌙 다크모드";
      }
    }
    let savedTheme = "light";
    try { savedTheme = localStorage.getItem("theme") || "light"; } catch (e) {}
    applyTheme(savedTheme);
    themeToggle.onclick = () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    };

    async function api(url, method = "GET", body) {
      const response = await fetch(url, body
        ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
        : { method });
      if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
      return response.status === 204 ? null : response.json();
    }

    async function run(action, job) {
      try { await job(); errorEl.hidden = true; }
      catch (error) { errorEl.textContent = `${action} 실패: ${error.message}`; errorEl.hidden = false; }
    }

    const load = () => run("목록 불러오기", async () => { allTodos = await api("/todos"); render(); });
    const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

    function makeButton(label, onclick, extraClass) {
      return Object.assign(document.createElement("button"), {
        textContent: label, onclick, className: extraClass || "",
      });
    }

    function render() {
      const status = $("status-filter").value;
      const priority = $("priority-filter").value;
      const todos = allTodos.filter((todo) =>
        (status === "all" || (status === "completed" ? todo.completed : !todo.completed)) &&
        (priority === "all" || todo.priority === priority)
      );

      if (todos.length === 0) {
        listEl.replaceChildren(Object.assign(document.createElement("li"), {
          className: "empty-state", textContent: "표시할 항목이 없습니다.",
        }));
        return;
      }

      listEl.replaceChildren(...todos.map((todo) => {
        const check = Object.assign(document.createElement("input"), {
          type: "checkbox", checked: todo.completed,
          onchange: () => save(todo.id, { ...todo, completed: check.checked }),
        });
        const text = Object.assign(document.createElement("span"), {
          textContent: todo.description ? `${todo.title} — ${todo.description}` : todo.title,
          className: `todo-text${todo.completed ? " done" : ""}`,
        });
        const priorityLabel = { high: "높음", medium: "보통", low: "낮음" }[todo.priority];
        const priorityEl = Object.assign(document.createElement("span"), {
          textContent: priorityLabel,
          className: `priority priority-${todo.priority}`,
        });
        const dueEl = todo.due_date ? Object.assign(document.createElement("span"), {
          textContent: `🗓 ${todo.due_date}`,
          className: "due",
        }) : null;
        const actions = Object.assign(document.createElement("div"), { className: "row-actions" });
        actions.append(
          makeButton("Edit", () => edit(todo)),
          makeButton("Delete", () => remove(todo.id), "danger"),
        );
        const item = document.createElement("li");
        item.append(check, text, priorityEl);
        if (dueEl) item.append(dueEl);
        item.append(actions);
        return item;
      }));
    }

    function edit(todo) {
      const title = prompt("새 제목:", todo.title);
      if (title === null) return;
      const description = prompt("새 설명:", todo.description);
      if (description === null) return;
      const priority = prompt("우선순위 (high / medium / low):", todo.priority);
      if (priority === null) return;
      if (!["high", "medium", "low"].includes(priority.trim())) {
        errorEl.textContent = "수정 실패: 우선순위는 high, medium, low 중 하나여야 합니다.";
        errorEl.hidden = false;
        return;
      }
      const dueDate = prompt("마감일 (YYYY-MM-DD, 비우면 없음):", todo.due_date || "");
      if (dueDate === null) return;
      save(todo.id, { ...todo, title: title.trim(), description: description.trim(), priority: priority.trim(), due_date: dueDate.trim() || null });
    }

    function remove(id) {
      if (!confirm("정말 삭제할까요?")) return;
      run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
    }

    $("todo-form").onsubmit = (event) => {
      event.preventDefault();
      run("추가", async () => {
        await api("/todos", "POST", {
          title: $("title").value.trim(),
          description: $("description").value.trim(),
          priority: $("priority").value,
          due_date: $("due-date").value || null,
        });
        event.target.reset();
        await load();
      });
    };
    $("status-filter").onchange = render;
    $("priority-filter").onchange = render;
    $("clear-completed").onclick = () => {
      if (!confirm("완료된 항목을 모두 삭제할까요?")) return;
      run("완료 항목 일괄삭제", async () => { await api("/todos/completed", "DELETE"); await load(); });
    };
    load();
  </script>
</body>
</html>
