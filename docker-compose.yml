services:
  fastapi-app:
    build:
      context: ./fastapi-app
      dockerfile: Dockerfile
    container_name: fastapi-app-compose-sogang017
    ports:
      - "5017:8000"
    environment:
      - PYTHONUNBUFFERED=1        # 로그를 버퍼링 없이 바로 stdout으로 출력
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 부하테스트로 한계점을 보기 위해 임의로 가정한 운영 제약(Operational Profile 대비 저사양 환경).
    # Grafana/cAdvisor형 대시보드에서 이 한도에 가까워지는 지점을 관찰한다.
    mem_limit: "128m"
    cpus: "0.5"
    networks:
      - loadtest-net

  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: jmeter-sogang017
    volumes:
      - ./jmeter:/jmeter
    command:
      - jmeter
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -l
      - /jmeter/results.jtl
      - -JTARGET_HOST=fastapi-app
      - -JTARGET_PORT=8000
      - -JINFLUXDB_URL=http://influxdb:8086/write?db=jmeter
      - -Jjmeter.save.saveservice.output_format=csv
      - -e
      - -o
      - /jmeter/report
    networks:
      - loadtest-net

  influxdb:
    image: influxdb:1.8
    container_name: influxdb-sogang017
    environment:
      - INFLUXDB_DB=jmeter
    ports:
      - "127.0.0.1:8117:8086"   # 인증 없는 쓰기 API라 외부 노출 금지
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - loadtest-net

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube-sogang017
    ports:
      - "127.0.0.1:9017:9000"   # 0.0.0.0 바인딩 금지 (인증 없는 관리 UI 노출 방지)
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - loadtest-net

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus-sogang017
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:7017:9090"   # 외부 노출 금지
    networks:
      - loadtest-net

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana-sogang017
    ports:
      - "3002:3000"   # 팀 서버 공용 포트 — 팀 내 자리순 배정(본인: 2번째 자리)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 설정하세요}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_PASSWORD_POLICY=true
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - loadtest-net

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter-sogang017
    ports:
      - "127.0.0.1:7117:9100"   # 인증 없음 — 외부 노출 금지
    networks:
      - loadtest-net

  loki:
    image: grafana/loki:3.7.9
    container_name: loki-sogang017
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3117:3100"   # 인증 없음 — 외부 노출 금지, SSH 터널로 접속
    volumes:
      - loki-data:/loki
    networks:
      - loadtest-net

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy-sogang017
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12417:12345"   # Alloy UI, 외부 노출 금지
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - loadtest-net

networks:
  loadtest-net:
    driver: bridge

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  prometheus-data:
  grafana-data:
  influxdb-data:
  loki-data:
  alloy-data:
